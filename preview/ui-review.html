<style>
*{box-sizing:border-box}body{margin:0;background:#e4eae6;color:#183e37;font:16px/1.7 system-ui,sans-serif}
header{padding:12px 20px;background:#fffefa;border-bottom:1px solid #c7d4cd;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:18px;margin:0}p{margin:0;font-size:13px;color:#50615a}nav,.sizes{display:flex;gap:8px;flex-wrap:wrap}
a,button{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border:1px solid #b9ccc0;border-radius:8px;background:#fff;color:#183e37;font:inherit;text-decoration:none;cursor:pointer}
button[aria-pressed=true]{background:#183e37;color:white}a:focus-visible,button:focus-visible{outline:3px solid #a98237;outline-offset:3px}
main{padding:16px;overflow:auto}.frame-wrap{width:390px;max-width:100%;margin:auto;background:#071923;border:1px solid #a0b4a9;border-radius:12px;overflow:hidden}

</style>
</head>
<body>
<header>
 <div><h1>معاينة الواجهة</h1><p>نسخة منفصلة للمراجعة. العرض الضيق يحاكي مساحة شاشة الهاتف، ولا يحل محل تجربة جهاز حقيقي.</p></div>

<script>
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
 document.querySelector('.frame-wrap').style.width=button.dataset.width+'px';
 document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
}));
</script>
