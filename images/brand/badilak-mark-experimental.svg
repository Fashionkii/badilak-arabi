<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">علامة بديلك عربي — المشكاة</title>
  <desc id="desc">مشكاة هندسية مبسطة يتجه داخلها مسار نحو الضوء، رمزًا للاكتشاف والاختيار</desc>
  <defs>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245D52"/>
      <stop offset="1" stop-color="#0F3E3C"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset=".55" stop-color="#F1DEC2"/>
      <stop offset="1" stop-color="#E4C9A5"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#82A996"/>
      <stop offset="1" stop-color="#547F70"/>
    </linearGradient>
    <clipPath id="niche">
      <path d="M6 62V25C6 16.7 13.2 10.9 21 5.9L32 0L43 5.9C50.8 10.9 58 16.7 58 25V62Z"/>
    </clipPath>
  </defs>
  <!-- Outer silhouette is an abstract niche, not a lantern. -->
  <path d="M6 62V25C6 16.7 13.2 10.9 21 5.9L32 0L43 5.9C50.8 10.9 58 16.7 58 25V62Z" fill="url(#arch)"/>
  <g clip-path="url(#niche)">
    <path d="M14 16C24 6 41 8 51 20L58 26V0H5V33Z" fill="#96B5A5" opacity=".12"/>
    <!-- The warm center suggests illumination inside the niche. -->
    <path d="M20.5 62V34.5C20.5 25 25.3 19 32 15.2C38.7 19 43.5 25 43.5 34.5V62Z" fill="#FFF9EF"/>
    <path d="M23 62V35C23 28.3 26.2 23.9 32 20.6C37.8 23.9 41 28.3 41 35V62Z" fill="url(#light)"/>
    <path d="M27.3 54V36.7C27.3 32.5 29 29.5 32 27.3C35 29.5 36.7 32.5 36.7 36.7V54Z" fill="#FFF9EE" opacity=".7"/>
    <!-- Landscape and winding choice-path in deliberately large shapes for favicon legibility. -->
    <path d="M4 62C9.5 52 19.5 45.1 29 43.4C37.4 41.8 45 44.3 60 55V64H4Z" fill="url(#ground)"/>
    <path d="M15 64C23 57.3 36 57 39.5 50.9C41.8 47.1 36.5 45.9 32 44.5C27 43 27.8 40.7 32.7 39.1C36 37.9 39.9 37.9 43 38" fill="none" stroke="#FFF9EF" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>